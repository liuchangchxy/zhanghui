[project]
name = "webnovel-writer-scripts"
version = "0.1.0"
description = "Root scripts for webnovel-writer plugin"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "aiohttp>=3.8",
    "filelock>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
