[project]
name = "webnovel-writer-scripts"
version = "0.1.0"
description = "Root scripts for webnovel-writer plugin"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "aiohttp>=3.8",
    "filelock>=3.0",
    # P0-Full addition: init_reference_tree.py uses these for Chinese title slugs and report rendering
    "jieba>=0.42",
    "jinja2>=3.1",
    "pypinyin>=0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*", "data_modules*"]
exclude = ["tests*", "dev-only*", "_shared*", "data_modules.tests*"]